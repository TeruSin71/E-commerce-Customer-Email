_schema-version: 3.3.0
ID: E-commerce_Customer_Courier_Email
version: 1.0.0
description: "Courier booking system — CAP service (courier-srv) + HANA + Fiori on SAP BTP Cloud Foundry."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        # Work Zone CDM content rides in the same html5-repo upload as the app zip.
        # Deployed name MUST be cdm.json — the html5-apps-repo runtime serves it at
        # /applications/cdm/courier.service (sap.cloud.service in the app manifest).
        - mkdir -p gen/app
        - cp app/workzone/CommonDataModel.json gen/app/cdm.json
modules:
  - name: E-commerce_Customer_Courier_Email-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: E-commerce_Customer_Courier_Email-auth
      - name: E-commerce_Customer_Courier_Email-db
      - name: E-commerce_Customer_Courier_Email-connectivity
      - name: E-commerce_Customer_Courier_Email-destination

  - name: E-commerce_Customer_Courier_Email-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: E-commerce_Customer_Courier_Email-db

  - name: E-commerce_Customer_Courier_Email-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: Ecommerce_Customer_Courier_Emailshipmentlookup
          artifacts:
            - shipment-lookup.zip
          target-path: app/
    requires:
      - name: E-commerce_Customer_Courier_Email-auth
      - name: E-commerce_Customer_Courier_Email-html5-repo-host
        parameters:
          content-target: true

  - name: Ecommerce_Customer_Courier_Emailshipmentlookup
    type: html5
    path: app/shipment-lookup
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  # Work Zone content-provider DESIGN-TIME destination (courier-cdm-dt): lets the
  # Work Zone Channel Manager read the CDM from the HTML5 repo, authenticated via a
  # service key on the courier-html5-rt app-runtime instance. (The RUNTIME
  # destination courier-cdm-rt needs the subaccount SUBDOMAIN — a cockpit value —
  # created there or on a later deploy; see docs/task-log.)
  - name: E-commerce_Customer_Courier_Email-workzone-dest-content
    type: com.sap.application.content
    build-parameters:
      no-source: true
    requires:
      - name: E-commerce_Customer_Courier_Email-destination
        parameters:
          content-target: true
      - name: E-commerce_Customer_Courier_Email-html5-repo-runtime
        parameters:
          service-key:
            name: courier-html5-rt-key
    parameters:
      content:
        subaccount:
          existing_destinations_policy: update
          destinations:
            - Name: courier-cdm-dt
              ServiceInstanceName: courier-html5-rt
              ServiceKeyName: courier-html5-rt-key
              URL: https://html5-apps-repo-rt.${default-domain}/applications/cdm/courier.service

resources:
  - name: E-commerce_Customer_Courier_Email-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: E-commerce_Customer_Courier_Email-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
  - name: E-commerce_Customer_Courier_Email-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: E-commerce_Customer_Courier_Email-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
  - name: E-commerce_Customer_Courier_Email-destination
    type: org.cloudfoundry.managed-service
    requires:
      - name: srv-api
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          subaccount:
            existing_destinations_policy: update
            destinations:
              # srv-api: what app/shipment-lookup/xs-app.json routes point at.
              # Token-forwarding so the user's JWT reaches courier-srv — the
              # scope+plant checks (S3/S7) run server-side on the real token.
              - Name: srv-api
                Description: courier-srv API for the Fiori apps
                URL: ~{srv-api/srv-url}
                Type: HTTP
                ProxyType: Internet
                Authentication: NoAuthentication
                HTML5.ForwardAuthToken: true
                HTML5.DynamicDestination: true
              # Work Zone content-provider RUNTIME destination (site host).
              # Subdomain confirmed by Teru 2026-07-18 from the live site URL.
              - Name: courier-cdm-rt
                Description: Work Zone content-provider runtime destination
                URL: https://btpsandbox.launchpad.cfapps.ap10.hana.ondemand.com
                Type: HTTP
                ProxyType: Internet
                Authentication: NoAuthentication
                CEP.HTML5contentprovider: true

  - name: E-commerce_Customer_Courier_Email-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  # app-runtime instance whose service key authenticates courier-cdm-dt against the
  # HTML5 repo. Short explicit service-name: CF caps instance names at 50 chars.
  - name: E-commerce_Customer_Courier_Email-html5-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
      service-name: courier-html5-rt
