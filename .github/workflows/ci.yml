name: CI

# The PR gate. Every job below becomes a "required status check" in the branch
# ruleset once it is green with real code — then a red job blocks auto-merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install CAP tools
        run: npm install --global @sap/cds-dk@^9
      - name: cds build
        run: cds build

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install CAP tools
        run: npm install --global @sap/cds-dk@^9
      - name: cds lint
        run: cds lint .

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run tests (skips gracefully until a test script exists)
        run: npm run test --if-present
