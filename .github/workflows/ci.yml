name: CI

# The PR gate. Every job here becomes a required status check in the ruleset.
# Kept intentionally to the checks that are meaningful on the current codebase.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install CAP tools
        run: npm install --global @sap/cds-dk@^9
      - name: cds build
        run: cds build

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run tests (skips gracefully until a test script exists)
        run: npm run test --if-present

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: eslint (incl. @sap/eslint-plugin-cds)
        run: npx eslint .

# lint + CodeQL re-enabled (task 1.4) now that srv/ has code. Making them
# REQUIRED checks needs a ruleset edit (repo admin) — see task-log.
