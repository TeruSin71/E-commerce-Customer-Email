name: CI

# The PR gate. Every job here becomes a required status check in the ruleset.
# Kept intentionally to the checks that are meaningful on the current codebase.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install CAP tools
        run: npm install --global @sap/cds-dk@^9
      - name: cds build
        run: cds build

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run tests (skips gracefully until a test script exists)
        run: npm run test --if-present

# DEFERRED until srv/ has real service code (ponytail: re-enable later):
#   - lint  : `cds lint` needs eslint + @sap/eslint-plugin-cds installed; nothing
#             to lint on an empty scaffold. Add eslint devDeps, then a lint job.
#   - CodeQL: no JavaScript to analyze yet, so it errors. Restore codeql.yml once
#             handlers exist under srv/.
